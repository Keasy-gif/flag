<svg viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="flagGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FF5A2E"/>
      <stop offset="0.55" stop-color="#FF2E63"/>
      <stop offset="1" stop-color="#B02AFF"/>
    </linearGradient>
    <radialGradient id="glowOrange" cx="0.85" cy="0.1" r="0.7">
      <stop offset="0" stop-color="#FF5A2E" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#FF5A2E" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowViolet" cx="0.1" cy="0.95" r="0.75">
      <stop offset="0" stop-color="#B02AFF" stop-opacity="0.24"/>
      <stop offset="1" stop-color="#B02AFF" stop-opacity="0"/>
    </radialGradient>
    <pattern id="stripes" width="9" height="9" patternUnits="userSpaceOnUse">
      <rect width="9" height="9" fill="none"/>
      <rect x="0" width="2" height="9" fill="#FFFFFF" opacity="0.045"/>
    </pattern>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="18" stdDeviation="34" flood-color="#FF2E63" flood-opacity="0.35"/>
    </filter>
    <clipPath id="rounded">
      <rect width="1024" height="1024" rx="224"/>
    </clipPath>
  </defs>

  <g clip-path="url(#rounded)">
    <rect width="1024" height="1024" fill="#0D0B0E"/>
    <rect width="1024" height="1024" fill="url(#glowOrange)"/>
    <rect width="1024" height="1024" fill="url(#glowViolet)"/>
    <rect width="1024" height="1024" fill="url(#stripes)"/>

    <!-- drapeau -->
    <g filter="url(#soft)">
      <path d="M 372 268
               C 500 218, 560 338, 668 302
               C 706 289, 736 275, 736 275
               L 736 505
               C 736 505, 706 519, 668 532
               C 560 568, 500 448, 372 498
               Z"
            fill="url(#flagGrad)"/>
    </g>

    <!-- mât -->
    <rect x="330" y="238" width="42" height="548" rx="21" fill="#F5F3F4"/>
    <circle cx="351" cy="238" r="34" fill="#F5F3F4"/>

    <!-- point de validation -->
    <circle cx="351" cy="238" r="16" fill="url(#flagGrad)"/>
  </g>
</svg>
